name: Add Employee Portal Navigation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-employee-portal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add employee portal link
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")

          nav_link = '<a href="/employee-portal.html" class="employee-portal-nav" aria-label="بوابة الموظفين">بوابة الموظفين</a>'
          hero_button = '<a href="/employee-portal.html" class="btn btn-teal employee-portal-hero">بوابة الموظفين <span aria-hidden="true">↗</span></a>'

          css = '''
          <style id="employee-portal-nav-style">
            .employee-portal-nav{
              color:#fff !important;
              background:linear-gradient(135deg,#1F9C82,#5FCBB2) !important;
              font-weight:900 !important;
              box-shadow:0 8px 24px rgba(31,156,130,.22);
            }
            .employee-portal-nav:hover{transform:translateY(-1px);}
            .employee-portal-hero{box-shadow:0 14px 30px rgba(31,156,130,.18);}
            @media(max-width:900px){
              .employee-portal-nav{display:block !important;text-align:center;margin-top:6px;}
            }
          </style>
          '''

          changed = False

          if "class=\"employee-portal-nav\"" not in html and "class='employee-portal-nav'" not in html:
              marker = '</nav>'
              if marker in html:
                  html = html.replace(marker, nav_link + '\n      ' + marker, 1)
                  changed = True

          if "class=\"employee-portal-hero\"" not in html:
              marker = '<div class="hero-buttons">'
              if marker in html:
                  html = html.replace(marker, marker + '\n        ' + hero_button, 1)
                  changed = True

          if 'id="employee-portal-nav-style"' not in html and '</head>' in html:
              html = html.replace('</head>', css + '\n</head>', 1)
              changed = True

          if changed:
              path.write_text(html, encoding="utf-8")
          else:
              print("Employee portal navigation is already installed.")

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "feat: expose employee portal from homepage"
            git push
          fi
