name: Publish employee portal
on:
  push:
    branches: [main]
    paths:
      - 'portal/employee-portal.html'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish portal
        run: |
          cp portal/employee-portal.html employee-portal.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add employee-portal.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: publish employee portal"
          git push
